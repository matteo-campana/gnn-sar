[tool.poetry]
name = "gnn-sar"
version = "0.1.0"
description = "Spatio-temporal GNN per il monitoraggio sub-annuale del consumo di suolo da serie Sentinel-1 SAR"
authors = ["Matteo Campana <matteo.campana996@gmail.com>"]
readme = "README.md"
packages = [{ include = "gnn_sar", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = "2.6.0"
pytorch-lightning = "2.5.0"
torch-geometric = "^2.8"
torchmetrics = "^1.4"
mlflow = ">=2.19,<4"
numpy = "^2.0"
scipy = "^1.13"
scikit-image = { version = "^0.24", optional = true }
rasterio = { version = "^1.3", optional = true }
requests = { version = "^2.31", optional = true }

[tool.poetry.extras]
# SLIC super-pixels. Without it, node geometries come from a cadastral layer
# (NodeGeometries.from_label_image) or a regular tiling.
segmentation = ["scikit-image"]
# Reading the preprocessed GeoTIFFs of a real study area and writing the
# sub-annual maps back out (`gnn-sar ingest`, `gnn-sar train --output-dir`).
geo = ["rasterio"]
# Searching and downloading from the Copernicus Data Space Ecosystem
# (`gnn-sar search`).
download = ["requests"]
# Everything needed to go from the archive to a map.
all = ["scikit-image", "rasterio", "requests"]

[tool.poetry.scripts]
gnn-sar = "gnn_sar.training.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
rasterio = "^1.3"
scikit-learn = "^1.5"
networkx = "^3.3"
matplotlib = "^3.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::FutureWarning:torch.jit._script",
    "ignore:.*does not have many workers.*:UserWarning",
    "ignore:.*LeafSpec.*:FutureWarning",
    # Lightning substituting bf16 for fp16 AMP on a CPU runner is the
    # portability the precision flag promises, not a problem.
    "ignore:.*AMP with fp16 is not supported on CPU.*:UserWarning",
]
